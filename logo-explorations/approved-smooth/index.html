<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Hey Atu Logo · 认可版流畅化</title>
<style>*{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:12px;background:#ececec;font:14px -apple-system,"PingFang SC",sans-serif;color:#222}
h1{font-size:20px}h2{font-size:16px;margin:0 0 2px}p{margin:0 0 8px;color:#666}section{background:#fff;border-radius:12px;padding:10px;margin-bottom:10px}
.r{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}figure{margin:0}figure img{width:100%;aspect-ratio:1;display:block;border-radius:8px;padding:5%}figcaption{text-align:center;color:#777;font-size:12px;padding-top:3px}
.s{display:flex;gap:10px;align-items:center;margin-top:8px;color:#999;font-size:12px}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmp img{width:100%;aspect-ratio:1;object-fit:contain;background:#0E0E10;border-radius:8px}</style>
<h1>Hey Atu Logo · 产品认可版 · 流畅化</h1>
<section><h2>对照：原图 vs 流畅化</h2><p>造型、比例、斑块台阶都保留，只去掉锯齿与手抖</p><div class=cmp><figure><img src="original.png"><figcaption>原图</figcaption></figure><figure><img src="svg/a-color.svg?v=1"><figcaption>流畅化 A</figcaption></figure></div></section>
<section><h2>A · 贴合原图</h2><p>最大程度保留原图手绘走向，只清理边缘</p><div class=r><figure><img src="svg/a-color.svg?v=1" style="background:#0E0E10" alt="彩色主标"><figcaption>彩色主标</figcaption></figure><figure><img src="svg/a-outline.svg?v=1" style="background:#F7F7F7" alt="描边版"><figcaption>描边版</figcaption></figure><figure><img src="svg/a-mono.svg?v=1" style="background:#F7F7F7" alt="单色版"><figcaption>单色版</figcaption></figure><figure><img src="svg/a-line.svg?v=1" style="background:#F7F7F7" alt="线条版"><figcaption>线条版</figcaption></figure></div><div class=s><img src="svg/a-color.svg?v=1" style="width:64px;height:64px;background:#0E0E10;border-radius:12px"><img src="svg/a-color.svg?v=1" style="width:32px;height:32px;background:#0E0E10;border-radius:6px"><img src="svg/a-color.svg?v=1" style="width:16px;height:16px;background:#0E0E10;border-radius:3px"><span>64 / 32 / 16 px</span></div></section>
<section><h2>B · 再顺一点</h2><p>在 A 的基础上把细小起伏再收顺一档</p><div class=r><figure><img src="svg/b-color.svg?v=1" style="background:#0E0E10" alt="彩色主标"><figcaption>彩色主标</figcaption></figure><figure><img src="svg/b-outline.svg?v=1" style="background:#F7F7F7" alt="描边版"><figcaption>描边版</figcaption></figure><figure><img src="svg/b-mono.svg?v=1" style="background:#F7F7F7" alt="单色版"><figcaption>单色版</figcaption></figure><figure><img src="svg/b-line.svg?v=1" style="background:#F7F7F7" alt="线条版"><figcaption>线条版</figcaption></figure></div><div class=s><img src="svg/b-color.svg?v=1" style="width:64px;height:64px;background:#0E0E10;border-radius:12px"><img src="svg/b-color.svg?v=1" style="width:32px;height:32px;background:#0E0E10;border-radius:6px"><img src="svg/b-color.svg?v=1" style="width:16px;height:16px;background:#0E0E10;border-radius:3px"><span>64 / 32 / 16 px</span></div></section>
